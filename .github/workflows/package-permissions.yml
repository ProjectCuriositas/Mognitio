name: Package non-owner regression
on:
  pull_request:
    paths:
      - "scripts/package-toolchain.py"
      - "tests/v015*permissions.py"
      - "tests/v015-system-package-user.py"
      - ".github/workflows/package-permissions.yml"
permissions:
  contents: read
jobs:
  non-owner:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["24.04", "26.04"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Fetch immutable regression fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir fixture
          gh release download v0.15.0 --pattern mognitio_0.15.0-1_amd64.deb --dir fixture
          echo '07b309eb241fd55cda0f35ef13cf6754de5598c53e7e53a1dd7945952c406706  fixture/mognitio_0.15.0-1_amd64.deb' | sha256sum --check
      - name: Install as root and execute as a different user
        env:
          UBUNTU: ${{ matrix.ubuntu }}
        run: |
          docker run --rm -v "$PWD:/source:ro" -v "$PWD/fixture:/fixture:ro" "ubuntu:$UBUNTU" sh -eu -c '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3 libzstd1 util-linux
            dpkg-deb -x /fixture/mognitio_0.15.0-1_amd64.deb /original
            payload=$(find /original/usr/lib/mognitio -mindepth 1 -maxdepth 1 -type d)
            python3 /source/scripts/package-toolchain.py "$payload" --output /fixed
            python3 /source/tests/v015-package-permissions.py --payload "$payload"
            dpkg -i /fixture/mognitio_0.15.0-1_amd64.deb
            python3 /source/tests/v015-system-package-user.py --expected-version 0.15.0 --expect-denied
            # dpkg preserves an existing directory mode; this identical-build
            # fixture must start fresh. Real v0.15.1 has a new build directory.
            dpkg --purge mognitio
            dpkg -i /fixed/mognitio_0.15.0-1_amd64.deb
            python3 /source/tests/v015-system-package-user.py --expected-version 0.15.0 --expected-label mgn
            dpkg -i /fixed/mognitio_0.15.0-1_amd64.deb
            python3 /source/tests/v015-system-package-user.py --expected-version 0.15.0 --expected-label mgn
            dpkg --purge mognitio
            test ! -e /usr/bin/mgn
          '
